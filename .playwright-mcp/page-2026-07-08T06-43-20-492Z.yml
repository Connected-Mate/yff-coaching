    - paragraph [ref=f1e23]: "YFF Coaching (Your Functional Fitness) est dirigé par Yohan Plier, coach HYROX certifié et Ambassadeur HYROX Canada/USA pour les saisons 2024/25 et 25/26. Avec plus de 15 courses HYROX réalisées dans le monde entier et un diplôme en Sciences du Sport (STAPS - Université Paris Descartes), il propose à Toulouse : coaching personnel à domicile, en extérieur ou en salle ; cours collectifs HYROX et Bootcamp à la Prairie des Filtres tous les mercredis à 18h30 ; coaching HYROX en ligne et programmes personnalisés pour remise en forme, perte de poids, prise de masse musculaire et préparation aux concours (pompier, gendarmerie)."
